        // --- START: services/geminiService.ts ---
        const API_KEY = process.env.API_KEY;
        if (!API_KEY) {
          console.error("Zmienna środowiskowa API_KEY nie jest ustawiona. Niektóre funkcje mogą nie działać.");
        }
        const ai = new GoogleGenAI({ apiKey: API_KEY });

        const DOCTOR_SYSTEM_INSTRUCTION = 'Jesteś pomocnym asystentem AI, który analizuje objawy zdrowotne. Twoim celem jest dostarczenie ogólnych informacji i możliwych przyczyn, ale NIGDY nie stawiasz ostatecznej diagnozy. Zawsze, na początku i na końcu swojej odpowiedzi, musisz umieścić wyraźne ostrzeżenie, że nie jesteś prawdziwym lekarzem i że użytkownik powinien skonsultować się z profesjonalistą medycznym w celu uzyskania dokładnej diagnozy i leczenia. Odpowiadaj w sposób empatyczny, ale rzeczowy. Używaj prostego i zrozumiałego języka.';
        
        const generateStory = async (prompt) => {
          if (!API_KEY) throw new Error("API_KEY not configured.");
          const response = await ai.models.generateContent({
            model: 'gemini-2.5-flash',
            contents: `Napisz krótką, kreatywną historię na podstawie tego opisu: ${prompt}`,
            config: {
              systemInstruction: 'Jesteś kreatywnym gawędziarzem, który pisze wciągające i barwne opowieści.',
            },
          });
          return response.text;
        };

        const analyzeSymptoms = async (symptoms) => {
          if (!API_KEY) throw new Error("API_KEY not configured.");
          const response = await ai.models.generateContent({
            model: 'gemini-2.5-flash',
            contents: `Przeanalizuj następujące objawy: "${symptoms}". Podaj możliwe przyczyny, ogólne zalecenia i wskaż, kiedy należy pilnie skontaktować się z lekarzem.`,
            config: {
              systemInstruction: DOCTOR_SYSTEM_INSTRUCTION,
            },
          });
          return response.text;
        };

        const generateImage = async (prompt) => {
            if (!API_KEY) throw new Error("API_KEY not configured.");
            const response = await ai.models.generateImages({
                model: 'imagen-4.0-generate-001',
                prompt: prompt,
                config: {
                  numberOfImages: 1,
                  outputMimeType: 'image/png',
                  aspectRatio: '1:1',
                },
            });
            
            const base64ImageBytes = response.generatedImages[0].image.imageBytes;
            return `data:image/png;base64,${base64ImageBytes}`;
        };

        const fileToBase64 = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve((reader.result).split(',')[1]);
                reader.onerror = (error) => reject(error);
            });
        };

        const generateVideo = async (prompt, image, onProgress) => {
          if (!API_KEY) throw new Error("API_KEY not configured.");
          onProgress('Rozpoczynam generowanie wideo...');
          
          const request = {
            model: 'veo-2.0-generate-001',
            prompt: prompt,
            config: {
                numberOfVideos: 1
            }
          };

          if (image) {
              onProgress('Przetwarzam obraz...');
              const imageBase64 = await fileToBase64(image);
              request.image = {
                  imageBytes: imageBase64,
                  mimeType: image.type
              };
          }

          onProgress('Wysyłam zapytanie do modelu...');
          let operation = await ai.models.generateVideos(request);
          
          onProgress('Model przyjął zadanie. Oczekiwanie może potrwać kilka minut...');
          let progressCounter = 0;
          const progressMessages = [
              'Model przygotowuje scenę...',
              'Renderowanie pierwszych klatek...',
              'Łączenie ujęć w całość...',
              'Dodawanie ostatnich szlifów...',
              'Już prawie gotowe, chwila cierpliwości!'
          ];

          while (!operation.done) {
            await new Promise(resolve => setTimeout(resolve, 10000));
            onProgress(progressMessages[progressCounter % progressMessages.length]);
            progressCounter++;
            operation = await ai.operations.getVideosOperation({ operation: operation });
          }

          onProgress('Generowanie zakończone!');
          const downloadLink = operation.response?.generatedVideos?.[0]?.video?.uri;

          if (!downloadLink) {
            throw new Error("Nie udało się uzyskać linku do pobrania wideo.");
          }

          onProgress('Pobieram wideo...');
          const response = await fetch(`${downloadLink}&key=${API_KEY}`);
          if (!response.ok) {
            throw new Error("Pobieranie wideo nie powiodło się.");
          }
          const videoBlob = await response.blob();
          return URL.createObjectURL(videoBlob);
        };

        const LOCAL_AI_ENDPOINT = 'http://localhost:1234/v1/chat/completions';

        const generateLocalChatCompletion = async (messages, systemInstruction, modelName) => {
            const apiMessages = [
                { role: 'system', content: systemInstruction },
                ...messages.map(msg => ({
                    role: msg.sender === 'ai' ? 'assistant' : 'user',
                    content: msg.text
                }))
            ];

            const response = await fetch(LOCAL_AI_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: modelName,
                    messages: apiMessages,
                    temperature: 0.7,
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error("Błąd serwera lokalnego AI:", errorText);
                throw new Error('Lokalny model AI nie odpowiedział poprawnie. Upewnij się, że serwer jest uruchomiony.');
            }

            const data = await response.json();
            return data.choices[0]?.message?.content || '';
        };

              { role: 'system', content: systemInstruction },
              { role: 'user', content: prompt }
          ];

              headers: { 'Content-Type': 'application/json' },

                  messages: apiMessages,
                  temperature: 0.7,
              })

          if (!response.ok) {
            const errorText = await response.text();

            throw new Error('Lokalny model AI nie odpowiedział poprawnie. Upewnij się, że serwer jest uruchomiony.');

          const data = await response.json();
          return data.choices[0]?.message?.content || '';

        // --- START: components/Chat.tsx ---
        const Chat = ({ personaName, messages, isLoading, onSendMessage, isReady }) => {
          const [time, setTime] = useState(new Date());
          const [input, setInput] = useState('');
          const messagesEndRef = useRef(null);

          useEffect(() => {
            const timer = setInterval(() => setTime(new Date()), 60 * 1000);
            return () => clearInterval(timer);
          }, []);

          useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
          }, [messages, isLoading]);

          const handleSendMessageClick = () => {
              onSendMessage(input);
              setInput('');
          };
          
          const handleKeyPress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessageClick();
            }
          };

          const formattedTime = time.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
          const formattedDate = time.toLocaleDateString('pl-PL', { weekday: 'long', month: 'long', day: 'numeric' });

          return React.createElement("div", { className: "w-full h-full p-6 flex flex-col text-gray-200" },
            React.createElement("header", { className: "flex justify-between items-center mb-4 flex-shrink-0" },
              React.createElement("h1", { className: "text-2xl font-bold" }, personaName),

                    }
                    @keyframes fade-in-up {
                        0% { opacity: 0; transform: translateY(20px); }
                        100% { opacity: 1; transform: translateY(0); }
                    }
                    .animate-fade-in-scale { animation: fade-in-scale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
                    .animate-fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
                `)
            )
        );

        const App = () => {
          const [isAppReady, setIsAppReady] = useState(false);
          const [activeView, setActiveView] = useState('chat');
          const [apiProvider, setApiProvider] = useState('gemini');
          const [localModelName, setLocalModelName] = useState(null);
          const [persona, setPersona] = useState(null);
          const chatSessionRef = useRef(null);
          const [chatMessages, setChatMessages] = useState([]);
          const [isChatLoading, setIsChatLoading] = useState(true);
          const [storyContent, setStoryContent] = useState('');
          const [isStoryLoading, setIsStoryLoading] = useState(false);
          const [storyError, setStoryError] = useState(null);
          const [videoUrl, setVideoUrl] = useState(null);
          const [isVideoLoading, setIsVideoLoading] = useState(false);
          const [videoLoadingMessage, setVideoLoadingMessage] = useState('');
          const [videoError, setVideoError] = useState(null);
          const [generatedVideos, setGeneratedVideos] = useState([]);
          const [imageUrl, setImageUrl] = useState(null);
          const [isImageLoading, setIsImageLoading] = useState(false);
          const [imageError, setImageError] = useState(null);
          const [generatedImages, setGeneratedImages] = useState([]);
          const [doctorAnalysis, setDoctorAnalysis] = useState('');
          const [isDoctorLoading, setIsDoctorLoading] = useState(false);
          const [doctorError, setDoctorError] = useState(null);
          const [searchQuery, setSearchQuery] = useState('');
          const [isSearching, setIsSearching] = useState(false);
          const [searchResults, setSearchResults] = useState([]);

          useEffect(() => {
            const data = personaConfig;
            if (data && data.name && data.instructions) {
                setPersona(data);
                if (API_KEY) {
                  chatSessionRef.current = ai.chats.create({
                      model: 'gemini-2.5-flash',
                      config: { systemInstruction: data.instructions },
                  });
                }
                setChatMessages([{ sender: 'ai', text: `Cześć! Jestem ${data.name}. W czym mogę Ci dzisiaj pomóc?` }]);
            } else {
                console.error("Błąd ładowania pliku persony");
                setChatMessages([{ sender: 'ai', text: 'Nie udało mi się załadować mojej konfiguracji.' }]);
            }
            setIsChatLoading(false);
            setTimeout(() => setIsAppReady(true), 1800);

            const localModelData = localModelConfig;
            if (localModelData && localModelData.model) {
                setLocalModelName(localModelData.model);
            } else {
                console.log("Brak konfiguracji modelu lokalnego, funkcjonalność będzie ograniczona.");
            }
          }, []);

          const handleApiProviderChange = (provider) => {
            if (provider !== apiProvider) {
                setApiProvider(provider);
                if (persona) {
                    const modelInfo = provider === 'gemini'
                        ? 'w chmurze Gemini'
                        : `lokalnym ${localModelName}`;
                    setChatMessages([{ sender: 'ai', text: `Cześć! Jestem ${persona.name}. Rozmawiasz teraz z modelem ${modelInfo}. W czym mogę pomóc?` }]);
                }
                if (provider === 'gemini' && persona && API_KEY) {
                     chatSessionRef.current = ai.chats.create({
                        model: 'gemini-2.5-flash',
                        config: { systemInstruction: persona.instructions },
                    });
                }
            }
          };

          const handleSendChatMessage = async (message) => {
            if (!message.trim() || isChatLoading || !persona) return;

            const userMessage = { sender: 'user', text: message };
            const newMessages = [...chatMessages, userMessage];
            setChatMessages(newMessages);
            setIsChatLoading(true);

            try {
                let responseText;
                if (apiProvider === 'gemini') {
                    if (!chatSessionRef.current) throw new Error("Sesja czatu Gemini nie jest zainicjowana. Sprawdź swój klucz API.");
                    const response = await chatSessionRef.current.sendMessage({ message });
                    responseText = response.text;
                } else {
                    if (!localModelName) throw new Error("Nazwa modelu lokalnego nie jest załadowana.");
                    responseText = await generateLocalChatCompletion(newMessages, persona.instructions, localModelName);
                }
                const aiMessage = { sender: 'ai', text: responseText };
                setChatMessages(prev => [...prev, aiMessage]);
            } catch (err) {
                console.error(err);
                const errorMessageText = apiProvider === 'local' 
                    ? 'Nie udało się połączyć z lokalnym modelem AI. Upewnij się, że serwer jest uruchomiony na porcie 1234.'
                    : `Coś poszło nie tak. Sprawdź konsolę, by poznać szczegóły błędu. (${err.message})`;
                const errorMessage = { sender: 'ai', text: errorMessageText };
                setChatMessages(prev => [...prev, errorMessage]);
            } finally {
                setIsChatLoading(false);
            }
          };

          const handleGenerateStory = async (prompt) => {
            if (!prompt.trim() || isStoryLoading || !persona) return;
            setIsStoryLoading(true);
            setStoryError(null);
            setStoryContent('');
            try {
              let result;
              if (apiProvider === 'gemini') {
                result = await generateStory(prompt);
              } else {
                if (!localModelName) throw new Error("Nazwa modelu lokalnego nie jest załadowana.");
                const storySystemInstruction = 'Jesteś kreatywnym gawędziarzem, który pisze wciągające i barwne opowieści.';
                const fullPrompt = `Napisz krótką, kreatywną historię na podstawie tego opisu: ${prompt}`;
                result = await generateLocalText(fullPrompt, storySystemInstruction, localModelName);
              }
              setStoryContent(result);
            } catch (err) {
              setStoryError('Wystąpił nieoczekiwany błąd. Sprawdź połączenie, klucz API lub serwer lokalny i spróbuj ponownie.');
              console.error(err);
            } finally {
              setIsStoryLoading(false);
            }
          };

          const handleGenerateVideo = async (prompt, image) => {
            if (!prompt.trim() || isVideoLoading) return;
            setIsVideoLoading(true);
            setVideoError(null);
            setVideoUrl(null);
            try {
              const resultUrl = await generateVideo(prompt, image, (message) => {
                setVideoLoadingMessage(message);
              });
              setVideoUrl(resultUrl);
              setGeneratedVideos(prev => [...prev, { prompt, url: resultUrl }]);
            } catch (err) {
              setVideoError('Wystąpił błąd podczas generowania wideo. Upewnij się, że klucz API jest poprawny.');
              console.error(err);
            } finally {
              setIsVideoLoading(false);
              setVideoLoadingMessage('');
            }
          };

          const handleGenerateImage = async (prompt) => {
            if (!prompt.trim() || isImageLoading) return;
            setIsImageLoading(true);
            setImageError(null);
            setImageUrl(null);
            try {
              const resultUrl = await generateImage(prompt);
              setImageUrl(resultUrl);
              setGeneratedImages(prev => [...prev, { prompt, url: resultUrl }]);
            } catch (err) {
              setImageError('Wystąpił błąd podczas generowania obrazu. Upewnij się, że klucz API jest poprawny.');
              console.error(err);
            } finally {
              setIsImageLoading(false);
            }
          };
          
          const handleAnalyzeSymptoms = async (symptoms) => {
            if (!symptoms.trim() || isDoctorLoading) return;
            setIsDoctorLoading(true);
            setDoctorError(null);
            setDoctorAnalysis('');
            try {
              let result;
              if (apiProvider === 'gemini') {
                result = await analyzeSymptoms(symptoms);
              } else {
                if (!localModelName) throw new Error("Nazwa modelu lokalnego nie jest załadowana.");
                const fullPrompt = `Przeanalizuj następujące objawy: "${symptoms}". Podaj możliwe przyczyny, ogólne zalecenia i wskaż, kiedy należy pilnie skontaktować się z lekarzem.`;
                result = await generateLocalText(fullPrompt, DOCTOR_SYSTEM_INSTRUCTION, localModelName);
              }
              setDoctorAnalysis(result);
            } catch (err) {
              setDoctorError('Wystąpił nieoczekiwany błąd. Sprawdź połączenie, klucz API lub serwer lokalny i spróbuj ponownie.');
              console.error(err);
            } finally {
              setIsDoctorLoading(false);
            }
          };

          const handleSearch = (e) => {
            e.preventDefault();
            if (!searchQuery.trim()) {
                setIsSearching(false);
                setSearchResults([]);
                return;
            }
            const chatResults = chatMessages
                .filter(msg => msg.text.toLowerCase().includes(searchQuery.toLowerCase()))
                .map(msg => ({ type: 'Czat', content: msg.text }));
            
            let storyResults = [];
            if (storyContent.toLowerCase().includes(searchQuery.toLowerCase())) {
                storyResults.push({ type: 'Opowieść', content: storyContent });
            }
            const videoResults = generatedVideos
                .filter(vid => vid.prompt.toLowerCase().includes(searchQuery.toLowerCase()))
                .map(vid => ({ type: 'Wideo', content: vid.prompt }));
            
            const imageResults = generatedImages
                .filter(img => img.prompt.toLowerCase().includes(searchQuery.toLowerCase()))
                .map(img => ({ type: 'Obraz', content: img.prompt }));
                
            let doctorResults = [];
            if (doctorAnalysis.toLowerCase().includes(searchQuery.toLowerCase())) {
                doctorResults.push({ type: 'Analiza', content: doctorAnalysis });
            }

            setSearchResults([...chatResults, ...storyResults, ...videoResults, ...imageResults, ...doctorResults]);
            setIsSearching(true);
          };
          
          const clearSearch = () => {
            setSearchQuery('');
            setIsSearching(false);
            setSearchResults([]);
          };

          const NavButton = ({ view, label, children, disabled = false }) => {
            const isActive = activeView === view;
            return (
              React.createElement("button", {
                onClick: () => !disabled && setActiveView(view),
                className: `flex-1 flex flex-col items-center justify-center gap-1 p-2 rounded-lg transition-all duration-300 transform ${isActive ? 'bg-green-500/20 text-green-300 scale-105 shadow-md' : 'text-gray-400 hover:bg-green-500/10 hover:text-green-400'} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`,
                "aria-label": label,
                "aria-current": isActive,
                disabled: disabled,
                title: disabled ? "Niedostępne dla modelu lokalnego" : ""
              },
                children,
                React.createElement("span", { className: "text-xs font-medium" }, label)
              )
            );
          };

          const SearchResultsView = () => (
            React.createElement("div", { className: "p-6 flex flex-col h-full" },
                React.createElement("div", { className: "flex justify-between items-center mb-4" },
                    React.createElement("h2", { className: "text-xl font-bold text-gray-200" }, "Wyniki wyszukiwania"),
                    React.createElement("button", { onClick: clearSearch, className: "text-sm text-green-400 hover:underline" }, "Wyczyść")
                ),
                React.createElement("div", { className: "overflow-y-auto flex-grow pr-2 -mr-2" },
                    searchResults.length > 0 ? (
                        searchResults.map((result, index) => (
                            React.createElement("div", { key: index, className: "bg-gray-800/50 p-4 rounded-lg mb-3 border border-green-500/20" },
                                React.createElement("span", { className: `text-xs font-semibold px-2 py-1 rounded-full ${result.type === 'Czat' ? 'bg-green-500/20 text-green-300' : result.type === 'Opowieść' ? 'bg-purple-500/20 text-purple-300' : result.type === 'Wideo' ? 'bg-teal-500/20 text-teal-300' : result.type === 'Analiza' ? 'bg-red-500/20 text-red-300' : 'bg-blue-500/20 text-blue-300'}` },
                                    result.type
                                ),
                                React.createElement("p", { className: "mt-2 text-sm text-gray-300 line-clamp-3" }, result.content)
                            )
                        ))
                    ) : (
                        React.createElement("div", { className: "text-center text-gray-400 mt-10" },
                            React.createElement("p", null, `Brak wyników dla "${searchQuery}"`)
                        )
                    )
                )
            )
          );

          const renderActiveView = () => {
            switch(activeView) {
                case 'chat': return React.createElement(Chat, { personaName: persona?.name || 'Freeday', messages: chatMessages, isLoading: isChatLoading, onSendMessage: handleSendChatMessage, isReady: !!persona });
                case 'story': return React.createElement(StoryGenerator, { story: storyContent, isLoading: isStoryLoading, error: storyError, onGenerateStory: handleGenerateStory });
                case 'video': return React.createElement(VideoGenerator, { videoUrl: videoUrl, isLoading: isVideoLoading, loadingMessage: videoLoadingMessage, error: videoError, onGenerateVideo: handleGenerateVideo });
                case 'image': return React.createElement(ImageGenerator, { imageUrl: imageUrl, isLoading: isImageLoading, error: imageError, onGenerateImage: handleGenerateImage });
                case 'doctor': return React.createElement(Doctor, { analysis: doctorAnalysis, isLoading: isDoctorLoading, error: doctorError, onAnalyzeSymptoms: handleAnalyzeSymptoms });
                default: return null;
            }
          }

          return (
            React.createElement("div", { className: "min-h-screen font-sans flex flex-col items-center justify-center p-4" },
              React.createElement("div", { className: "w-full max-w-md h-[88vh] max-h-[900px] font-sans text-gray-200 overflow-hidden relative" },
                !isAppReady && React.createElement(WelcomeScreen, null),
                isAppReady && (
                    React.createElement("div", { className: "w-full h-full bg-black/40 rounded-3xl shadow-2xl shadow-green-500/10 flex flex-col backdrop-blur-2xl border border-green-500/20 animate-fade-in" },
                        React.createElement("header", { className: "p-4 border-b border-green-500/20" },
                            React.createElement("div", { className: "flex justify-center mb-3" },
                                React.createElement("div", { className: "p-1 rounded-lg bg-gray-900/50 flex text-sm shadow-inner" },
                                    React.createElement("button", { onClick: () => handleApiProviderChange('gemini'), className: `flex items-center gap-2 px-3 py-1 rounded-md transition-all ${apiProvider === 'gemini' ? 'bg-gray-800 shadow text-green-300 font-semibold' : 'text-gray-400'}` },
                                        React.createElement(CloudIcon, { className: "w-5 h-5" }), " Chmura"
                                    ),
                                    React.createElement("button", { onClick: () => localModelName && handleApiProviderChange('local'), disabled: !localModelName, className: `flex items-center gap-2 px-3 py-1 rounded-md transition-all ${apiProvider === 'local' ? 'bg-gray-800 shadow text-green-300 font-semibold' : 'text-gray-400'} disabled:text-gray-600 disabled:cursor-not-allowed`, title: !localModelName ? "Konfiguracja modelu lokalnego nieznaleziona" : `Użyj lokalnego serwera AI z modelem: ${localModelName}` },
                                        React.createElement(ServerIcon, { className: "w-5 h-5" }),
                                        apiProvider === 'local' && localModelName ? React.createElement("span", { className: "truncate max-w-32" }, localModelName) : 'Lokalny'
                                    )
                                )
                            ),
                            React.createElement("form", { onSubmit: handleSearch, className: "relative" },
                                React.createElement("input", { type: "text", value: searchQuery, onChange: (e) => setSearchQuery(e.target.value), placeholder: "Szukaj wszędzie...", className: "w-full bg-gray-900/50 rounded-lg pl-10 pr-10 py-2 text-sm focus:ring-2 focus:ring-green-400 border-transparent focus:border-transparent outline-none transition shadow-inner placeholder-gray-500" }),
                                React.createElement("div", { className: "absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" }, React.createElement(SearchIcon, { className: "w-5 h-5" })),
                                searchQuery && (
                                    React.createElement("button", { type: "button", onClick: clearSearch, className: "absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200" }, React.createElement(XMarkIcon, { className: "w-5 h-5" }))
                                )
                            )
                        ),
                        React.createElement("main", { className: "flex-grow overflow-hidden" },
                          isSearching ? React.createElement(SearchResultsView, null) : renderActiveView()
                        ),
                        !isSearching && (
                            React.createElement("nav", { className: "flex-shrink-0 p-2 border-t border-green-500/20 bg-black/20" },
                                React.createElement("div", { className: "flex justify-around items-center gap-2" },
                                    React.createElement(NavButton, { view: "chat", label: "Czat" }, React.createElement(ChatBubbleLeftRightIcon, { className: "w-6 h-6" })),
                                    React.createElement(NavButton, { view: "doctor", label: "Doktor" }, React.createElement(HeartPlusIcon, { className: "w-6 h-6" })),
                                    React.createElement(NavButton, { view: "story", label: "Opowieści" }, React.createElement(BookOpenIcon, { className: "w-6 h-6" })),
                                    React.createElement(NavButton, { view: "image", label: "Obrazy", disabled: apiProvider === 'local' }, React.createElement(PaintBrushIcon, { className: "w-6 h-6" })),
                                    React.createElement(NavButton, { view: "video", label: "Wideo", disabled: apiProvider === 'local' }, React.createElement(VideoCameraIcon, { className: "w-6 h-6" }))
                                )
                            )
                        ),
                         React.createElement("style", null, `
                            @keyframes fade-in {
                                0% { opacity: 0; transform: scale(0.95); }
                                100% { opacity: 1; transform: scale(1); }
                            }
                            .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
                        `)
                    )
                )
              )
            )
          );
        };
        // --- END: App.tsx ---

        // --- START: index.tsx ---
        const rootElement = document.getElementById('root');
        if (!rootElement) {
          throw new Error("Could not find root element to mount to");
        }

        const root = ReactDOM.createRoot(rootElement);
        root.render(
          React.createElement(React.StrictMode, null,
            React.createElement(App, null)
          )
        );
        // --- END: index.tsx ---

    </script>
</body>
</html>
